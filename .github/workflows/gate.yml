name: cursor-base gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure git core.autocrlf=false before checkout
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: PowerShell AST, Pure-ASCII & No-BOM verification (setup.ps1)
        run: |
          $ErrorActionPreference = 'Stop'
          $full = (Resolve-Path -LiteralPath 'setup.ps1').Path
          $bytes = [System.IO.File]::ReadAllBytes($full)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error "UTF-8 BOM detected in setup.ps1"
            exit 1
          }
          foreach ($b in $bytes) {
            if ($b -gt 0x7F) {
              Write-Error "Non-ASCII byte detected in setup.ps1"
              exit 1
            }
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            Write-Error "PowerShell parse error in setup.ps1: $($errors[0].Message)"
            exit 1
          }
          Write-Host "PowerShell AST, Pure-ASCII & No-BOM check passed."

      - name: Repository source doctor & pack-check
        run: |
          node .cursor/scripts/doctor.mjs --source-check --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/cursor-base.mjs pack-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full test suite (run-all.mjs if present)
        run: |
          if (Test-Path -LiteralPath '.cursor/tests/run-all.mjs') {
            node .cursor/tests/run-all.mjs --level all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host ".cursor/tests/run-all.mjs not present yet -- skipped"
          }

      - name: End-to-end NTFS Junction install / string-form / self-heal / conflict / uninstall (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ("cursor-base-e2e-" + [guid]::NewGuid().ToString('N'))
          $tmpDry = Join-Path ([System.IO.Path]::GetTempPath()) ("cursor-base-dry-" + [guid]::NewGuid().ToString('N'))
          try {
            & pwsh -NoProfile -File .\setup.ps1 (Join-Path $tmpDry 'CON')
            if ($LASTEXITCODE -eq 0) { throw "Expected CON path rejection" }

            & pwsh -NoProfile -File .\setup.ps1 -Target $tmpDry -DryRun -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -DryRun failed ($LASTEXITCODE)" }
            if (Test-Path -LiteralPath $tmpDry) { throw "DryRun must not create target directory" }

            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/skills/dev-builder/refs') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/agents') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/hooks') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/rules') -Force | Out-Null
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/CLAUDE.md'), "# SiteMaster`nConstitution.`n", $utf8NoBom)
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/skills/dev-builder/SKILL.md'), "# dev-builder`n", $utf8NoBom)
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/skills/dev-builder/refs/guide.md'), "precious-skill-payload`n", $utf8NoBom)
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/agents/implementer.md'), "---`nname: implementer`ndescription: Implementer`nmodel: sonnet`n---`n`nBody.`n", $utf8NoBom)
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/hooks/session-rules-banner.mjs'), "process.exit(0);`n", $utf8NoBom)
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/settings.json'), '{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"node","args":[".claude/hooks/session-rules-banner.mjs"]}]}]}}', $utf8NoBom)

            & pwsh -NoProfile -File .\setup.ps1 -Target $tmp -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 install failed ($LASTEXITCODE)" }
            & pwsh -NoProfile -File .\setup.ps1 -Target $tmp -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 repeated install failed ($LASTEXITCODE)" }

            $juncItem = Get-Item -LiteralPath (Join-Path $tmp '.cursor/skills') -Force
            if (-not ($juncItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) {
              throw "Expected .cursor/skills to be an NTFS Junction ReparsePoint on Windows"
            }
            $docOut = & node (Join-Path $tmp '.cursor/scripts/doctor.mjs') $tmp --json
            if ($LASTEXITCODE -ne 0) { throw "Downstream doctor failed: $docOut" }

            $hostRule = Join-Path $tmp '.cursor/rules/cc-base-cursor-host.mdc'
            Add-Content -LiteralPath $hostRule -Value "`n# Local Custom Host Note`n" -Encoding utf8NoBOM
            & pwsh -NoProfile -File .\setup.ps1 upgrade -Target $tmp -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 upgrade failed ($LASTEXITCODE)" }
            if (-not (Test-Path -LiteralPath ($hostRule + '.cursor-new'))) {
              throw "Expected .cursor-new on local modification"
            }
            Remove-Item -LiteralPath ($hostRule + '.cursor-new') -Force
            & pwsh -NoProfile -File .\setup.ps1 upgrade -Target $tmp -Force -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -Force upgrade failed ($LASTEXITCODE)" }

            & pwsh -NoProfile -File .\setup.ps1 -Uninstall -Target $tmp -Force
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -Uninstall failed ($LASTEXITCODE)" }
            if (Test-Path -LiteralPath (Join-Path $tmp '.cursor/skills')) { throw ".cursor/skills Junction should be removed" }
            $preserved = [System.IO.File]::ReadAllText((Join-Path $tmp '.claude/skills/dev-builder/refs/guide.md'))
            if ($preserved -ne "precious-skill-payload`n") {
              throw "CRITICAL: .claude/skills content was modified or deleted during Junction uninstall!"
            }
          } finally {
            foreach ($d in @($tmp, $tmpDry)) {
              if (Test-Path -LiteralPath $d) {
                Remove-Item -LiteralPath $d -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: End-to-end relative symlink install / string-form / self-heal / conflict / uninstall (POSIX setup.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh -n setup.sh
          sh -n setup-cursor.sh
          bash -n setup.sh

          TMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cursor-base-e2e.XXXXXX")"
          TMP_DRY="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cursor-base-dry.XXXXXX")"
          rm -rf "$TMP_DIR" "$TMP_DRY"
          trap 'rm -rf "$TMP_DIR" "$TMP_DRY"' EXIT

          if bash setup.sh --dryrun "$TMP_DRY" 2>/dev/null; then exit 1; fi
          if bash setup.sh "$TMP_DRY/CON" 2>/dev/null; then exit 1; fi

          bash setup.sh --target "$TMP_DRY" --dry-run --no-auto-cc
          test ! -e "$TMP_DRY"

          mkdir -p "$TMP_DIR/.claude/skills/dev-builder/refs" "$TMP_DIR/.claude/agents" "$TMP_DIR/.claude/hooks" "$TMP_DIR/.claude/rules"
          printf '# SiteMaster\nConstitution.\n' > "$TMP_DIR/.claude/CLAUDE.md"
          printf '# dev-builder\n' > "$TMP_DIR/.claude/skills/dev-builder/SKILL.md"
          printf 'precious-skill-payload\n' > "$TMP_DIR/.claude/skills/dev-builder/refs/guide.md"
          printf -- '---\nname: implementer\ndescription: Implementer\nmodel: sonnet\n---\n\nBody.\n' > "$TMP_DIR/.claude/agents/implementer.md"
          printf 'process.exit(0);\n' > "$TMP_DIR/.claude/hooks/session-rules-banner.mjs"
          printf '{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"node","args":[".claude/hooks/session-rules-banner.mjs"]}]}]}}\n' > "$TMP_DIR/.claude/settings.json"

          bash setup.sh "$TMP_DIR" --no-auto-cc
          bash setup.sh "$TMP_DIR" --no-auto-cc
          test -L "$TMP_DIR/.cursor/skills"
          test "$(readlink "$TMP_DIR/.cursor/skills")" = "../.claude/skills"
          test -f "$TMP_DIR/.cursor/rules/cc-base-claude.mdc"
          test -f "$TMP_DIR/.cursor/agents/implementer.md"
          node "$TMP_DIR/.cursor/scripts/doctor.mjs" "$TMP_DIR" --json

          printf '\n# Local Custom Host Note\n' >> "$TMP_DIR/.cursor/rules/cc-base-cursor-host.mdc"
          bash setup.sh upgrade --target "$TMP_DIR" --no-auto-cc
          test -f "$TMP_DIR/.cursor/rules/cc-base-cursor-host.mdc.cursor-new"
          rm -f "$TMP_DIR/.cursor/rules/cc-base-cursor-host.mdc.cursor-new"
          bash setup.sh upgrade --target "$TMP_DIR" --force --no-auto-cc
          node "$TMP_DIR/.cursor/scripts/doctor.mjs" "$TMP_DIR" --json

          bash setup.sh --uninstall --target "$TMP_DIR" --force
          test ! -e "$TMP_DIR/.cursor/skills"
          test ! -L "$TMP_DIR/.cursor/skills"
          test "$(cat "$TMP_DIR/.claude/skills/dev-builder/refs/guide.md")" = "precious-skill-payload"
          test -f "$TMP_DIR/.claude/agents/implementer.md"
